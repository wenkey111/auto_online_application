<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>iframe 内的字段</title>
    <style>
      body { font-family: "Microsoft YaHei", sans-serif; padding: 14px 18px; margin: 0; }
      .form-item { display: flex; align-items: center; margin-bottom: 10px; }
      .form-item > label { width: 130px; text-align: right; padding-right: 10px; font-size: 13px; color: #475569; }
      input, select { width: 300px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div class="form-item">
      <label>紧急联系人姓名</label>
      <input type="text" name="emergencyName" />
    </div>
    <div class="form-item">
      <label>紧急联系人电话</label>
      <input type="text" name="emergencyPhone" />
    </div>
    <div class="form-item">
      <label>户籍地址</label>
      <input type="text" name="hukou" />
    </div>
  </body>
</html>
